<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1d1d1f" />
  <title>POS System — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      padding: 40px 36px;
      width: 360px;
      max-width: 90vw;
    }
    .login-card h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1d1d1f;
      letter-spacing: -.01em;
      margin-bottom: 6px;
    }
    .login-card p {
      font-size: .85rem;
      color: #6e6e73;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: .78rem;
      font-weight: 600;
      color: #6e6e73;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-family: inherit;
      font-size: .9rem;
      color: #1d1d1f;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-group input:focus {
      border-color: #0071e3;
      box-shadow: 0 0 0 3px rgba(0,113,227,.12);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #1d1d1f;
      color: #fff;
      border: none;
      border-radius: 980px;
      font-family: inherit;
      font-size: .92rem;
      font-weight: 600;
      letter-spacing: -.01em;
      cursor: pointer;
      transition: background .2s, box-shadow .2s;
      box-shadow: 0 1px 2px rgba(0,0,0,.18);
      margin-top: 6px;
    }
    .btn-login:hover { background: #333; box-shadow: 0 4px 12px rgba(0,0,0,.22); }
    .btn-login:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
    .btn-login:active { transform: scale(.98); }
    @media (prefers-reduced-motion: reduce) {
      .btn-login:active { transform: none; }
    }
    .error-msg {
      background: rgba(255,59,48,.1);
      color: #b3211a;
      font-size: .8rem;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.show { display: block; }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: #1d1d1f;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-icon svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </div>
      <div>
        <h1>POS System</h1>
        <p style="margin-bottom:0">Enter your access code to continue</p>
      </div>
    </div>
    <div id="error-msg" class="error-msg"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="code">Access code</label>
        <input type="password" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus />
      </div>
      <button type="submit" class="btn-login">Sign in</button>
    </form>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      errEl.classList.remove('show');
      const code = document.getElementById('code').value.trim();
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/';
        } else {
          errEl.textContent = data.error || 'Login failed';
          errEl.classList.add('show');
        }
      } catch (err) {
        errEl.textContent = 'Network error';
        errEl.classList.add('show');
      }
    });
  </script>
</body>
</html>
